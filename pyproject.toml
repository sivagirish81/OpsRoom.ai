[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsroom-ai"
version = "0.1.0"
description = "Real-time multi-agent incident response war room"
requires-python = ">=3.11,<3.15"
dependencies = [
  "ag-ui-langgraph[fastapi]>=0.0.35",
  "copilotkit>=0.1.76",
  "fastapi>=0.115.12",
  "langgraph>=1.2.1",
  "numpy>=2.2.6",
  "openai>=1.82.1",
  "pydantic-settings>=2.9.1",
  "redis>=6.2.0",
  "redisvl>=0.17.0",
  "uvicorn[standard]>=0.34.2",
  "weave>=0.52.23",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

